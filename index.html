<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16423c" />
    <title>Climb Sync | ボルダリング出席カレンダー</title>
    <style>:root {
  color-scheme: light;
  --bg: #f5f3ed;
  --panel: #fffdf8;
  --panel-strong: #ffffff;
  --ink: #19312d;
  --muted: #69746f;
  --line: #ddd8cb;
  --brand: #176b5d;
  --brand-strong: #0f4d45;
  --accent: #d67b31;
  --good: #1f8a62;
  --maybe: #3e73ba;
  --unsure: #c78b20;
  --nope: #8f4b4b;
  --shadow: 0 18px 45px rgba(25, 49, 45, 0.12);
}

:root.dark {
  color-scheme: dark;
  --bg: #121614;
  --panel: #1b211e;
  --panel-strong: #232b27;
  --ink: #edf2ec;
  --muted: #a9b5ae;
  --line: #36403a;
  --brand: #5bc0a7;
  --brand-strong: #8be0ca;
  --accent: #e3a15d;
  --shadow: 0 18px 45px rgba(0, 0, 0, 0.32);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    linear-gradient(135deg, rgba(214, 123, 49, 0.12), transparent 30rem),
    linear-gradient(315deg, rgba(23, 107, 93, 0.1), transparent 36rem),
    var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button,
input,
textarea {
  font: inherit;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

.app-shell {
  width: min(1120px, 100%);
  min-height: 100vh;
  margin: 0 auto;
  padding: 18px 18px 92px;
}

.topbar,
.section-head,
.group-panel,
.dialog-head,
.group-copy,
.share-actions,
.month-controls {
  display: flex;
  align-items: center;
}

.topbar,
.section-head,
.group-panel,
.dialog-head {
  justify-content: space-between;
  gap: 16px;
}

.topbar {
  padding: 8px 2px 16px;
}

.eyebrow,
.muted {
  margin: 0 0 4px;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0;
}

h1,
h2,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 0;
  font-size: clamp(2rem, 7vw, 4.6rem);
  line-height: 0.95;
}

h2 {
  margin-bottom: 0;
  font-size: clamp(1.25rem, 3.2vw, 1.8rem);
}

.group-panel,
.view,
.day-dialog {
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  box-shadow: var(--shadow);
  backdrop-filter: blur(14px);
}

.group-panel {
  min-height: 132px;
  margin-bottom: 16px;
  padding: 18px;
  border-radius: 8px;
}

.group-copy {
  gap: 14px;
}

.gym-badge {
  display: grid;
  width: 64px;
  height: 64px;
  place-items: center;
  border-radius: 8px;
  background:
    linear-gradient(145deg, rgba(255, 255, 255, 0.2), transparent),
    var(--brand);
  color: white;
  font-weight: 900;
}

.share-actions,
.month-controls {
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.primary-action,
.secondary-action,
.today-button,
.icon-button {
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  text-decoration: none;
}

.primary-action,
.secondary-action,
.today-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 42px;
  padding: 0 14px;
  font-weight: 800;
}

.primary-action {
  background: var(--brand);
  color: white;
}

.primary-action:hover {
  background: var(--brand-strong);
}

.secondary-action,
.today-button {
  border: 1px solid var(--line);
  background: var(--panel-strong);
  color: var(--ink);
}

.compact {
  min-height: 38px;
}

.icon-button {
  display: inline-grid;
  width: 42px;
  height: 42px;
  place-items: center;
  border: 1px solid var(--line);
  background: var(--panel-strong);
  color: var(--ink);
  font-size: 1.4rem;
  font-weight: 800;
}

.view {
  display: none;
  min-height: 530px;
  padding: 18px;
  border-radius: 8px;
}

.view.active {
  display: block;
}

.weekday-row,
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
}

.weekday-row {
  gap: 8px;
  margin-top: 18px;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 800;
  text-align: center;
}

.calendar-grid {
  gap: 8px;
  margin-top: 8px;
}

.day-cell {
  position: relative;
  display: flex;
  min-height: 116px;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-strong);
  color: var(--ink);
  cursor: pointer;
  overflow: hidden;
  text-align: left;
}

.day-cell.is-muted {
  opacity: 0.48;
}

.day-cell.is-today {
  outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent);
}

.day-cell.is-popular {
  background:
    linear-gradient(145deg, color-mix(in srgb, var(--brand) 18%, transparent), transparent 70%),
    var(--panel-strong);
}

.day-number {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-weight: 900;
}

.count-badge {
  min-width: 26px;
  padding: 3px 7px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--accent) 20%, var(--panel));
  color: var(--ink);
  font-size: 0.72rem;
  text-align: center;
}

.avatars,
.member-strip {
  display: flex;
  align-items: center;
}

.avatars {
  min-height: 32px;
  max-width: 100%;
  overflow: hidden;
}

.avatar {
  display: inline-grid;
  width: 32px;
  height: 32px;
  place-items: center;
  margin-right: -8px;
  border: 2px solid var(--panel-strong);
  border-radius: 50%;
  color: white;
  font-size: 0.75rem;
  font-weight: 900;
}

.day-note {
  min-height: 18px;
  color: var(--muted);
  font-size: 0.74rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.timeline {
  margin-top: 18px;
  overflow-x: auto;
}

.timeline-table {
  min-width: 780px;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}

.timeline-row {
  display: grid;
  grid-template-columns: 92px repeat(7, 1fr);
  min-height: 64px;
}

.timeline-row + .timeline-row {
  border-top: 1px solid var(--line);
}

.timeline-cell,
.time-label {
  padding: 10px;
  border-left: 1px solid var(--line);
  background: var(--panel-strong);
}

.time-label {
  border-left: 0;
  color: var(--muted);
  font-weight: 800;
}

.timeline-pill {
  display: block;
  width: 100%;
  margin-bottom: 6px;
  padding: 5px 7px;
  border-radius: 999px;
  color: white;
  font-size: 0.74rem;
  font-weight: 800;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.notice-list {
  display: grid;
  gap: 12px;
  margin-top: 18px;
}

.notice-list article,
.profile-form,
.member-strip {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-strong);
}

.notice-list article {
  padding: 16px;
}

.notice-list p {
  margin: 8px 0 0;
  color: var(--muted);
}

.profile-form {
  display: grid;
  gap: 14px;
  max-width: 520px;
  margin-top: 18px;
  padding: 16px;
}

label {
  display: grid;
  gap: 7px;
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 800;
}

input,
textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: var(--ink);
  padding: 11px 12px;
}

textarea {
  resize: vertical;
}

.member-strip {
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 14px;
  padding: 14px;
}

.member-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px 6px 6px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  font-weight: 800;
}

.bottom-nav {
  position: fixed;
  right: 12px;
  bottom: 12px;
  left: 12px;
  z-index: 10;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  max-width: 680px;
  margin: 0 auto;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  box-shadow: var(--shadow);
  backdrop-filter: blur(18px);
}

.nav-item {
  display: grid;
  min-height: 50px;
  place-items: center;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 0.72rem;
  font-weight: 800;
}

.nav-item span {
  font-size: 1.15rem;
}

.nav-item.active {
  background: color-mix(in srgb, var(--brand) 16%, transparent);
  color: var(--ink);
}

.day-dialog {
  width: min(720px, calc(100% - 24px));
  max-height: min(820px, calc(100vh - 24px));
  padding: 0;
  border-radius: 8px;
  color: var(--ink);
}

.day-dialog::backdrop {
  background: rgba(0, 0, 0, 0.42);
}

.dialog-head,
.day-summary,
.attendance-form,
.thread {
  padding: 16px;
}

.day-summary {
  display: grid;
  gap: 10px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.participant {
  display: grid;
  grid-template-columns: 34px 1fr auto;
  align-items: center;
  gap: 10px;
}

.participant strong {
  display: block;
}

.participant span:last-child {
  color: var(--muted);
  font-size: 0.8rem;
  font-weight: 800;
}

.attendance-form {
  display: grid;
  gap: 14px;
}

fieldset {
  margin: 0;
  padding: 0;
  border: 0;
}

legend {
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 800;
}

.status-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.status-grid label {
  display: flex;
  min-height: 44px;
  align-items: center;
  gap: 8px;
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-strong);
  color: var(--ink);
}

.status-grid input {
  width: auto;
}

.time-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.full {
  width: 100%;
}

.thread {
  display: grid;
  gap: 10px;
  border-top: 1px solid var(--line);
}

.comment {
  padding: 10px 12px;
  border-radius: 8px;
  background: color-mix(in srgb, var(--brand) 10%, var(--panel));
}

.comment strong {
  display: block;
  margin-bottom: 4px;
}

.comment p {
  margin: 0;
  color: var(--muted);
}

.toast {
  position: fixed;
  right: 18px;
  bottom: 88px;
  z-index: 20;
  max-width: calc(100% - 36px);
  padding: 12px 14px;
  border-radius: 8px;
  background: var(--ink);
  color: var(--panel);
  box-shadow: var(--shadow);
  opacity: 0;
  transform: translateY(12px);
  transition: 180ms ease;
  pointer-events: none;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

@media (max-width: 760px) {
  .app-shell {
    padding: 14px 12px 92px;
  }

  .topbar {
    align-items: flex-start;
  }

  .group-panel,
  .section-head {
    align-items: stretch;
    flex-direction: column;
  }

  .share-actions,
  .month-controls {
    justify-content: stretch;
  }

  .share-actions > *,
  .month-controls > * {
    flex: 1;
  }

  .weekday-row,
  .calendar-grid {
    gap: 5px;
  }

  .day-cell {
    min-height: 86px;
    padding: 7px;
  }

  .day-number {
    align-items: flex-start;
    flex-direction: column;
    gap: 2px;
  }

  .day-note {
    display: none;
  }

  .avatar {
    width: 25px;
    height: 25px;
    margin-right: -9px;
    font-size: 0.64rem;
  }

  .count-badge {
    min-width: 0;
    padding: 1px 4px;
    font-size: 0.62rem;
  }

  .status-grid,
  .time-pair {
    grid-template-columns: 1fr;
  }

  .bottom-nav {
    right: 8px;
    bottom: 8px;
    left: 8px;
  }
}

@media (max-width: 430px) {
  .nav-item {
    font-size: 0.66rem;
  }

  .day-cell {
    min-height: 72px;
  }

  .avatars .avatar:nth-child(n + 2) {
    display: none;
  }
}
</style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Bouldering Attendance</p>
          <h1>Climb Sync</h1>
        </div>
        <button class="icon-button" id="themeToggle" type="button" aria-label="表示テーマを切り替え" title="表示テーマを切り替え">
          <span aria-hidden="true">◐</span>
        </button>
      </header>

      <main>
        <section class="group-panel" aria-label="グループ情報">
          <div class="group-copy">
            <div class="gym-badge" aria-hidden="true">CL</div>
            <div>
              <p class="muted">今週のグループ</p>
              <h2>水曜ボルダー会</h2>
              <p>招待コード <strong>CLIMB-610</strong> · <span id="syncStatus">接続中</span></p>
            </div>
          </div>
          <div class="share-actions">
            <button class="primary-action" id="copyInvite" type="button">
              <span aria-hidden="true">⛓</span>
              招待リンク
            </button>
            <a class="secondary-action" href="https://github.com/taic101400-png/climb-sync/archive/refs/heads/main.zip" download>
              <span aria-hidden="true">↓</span>
              ダウンロード
            </a>
          </div>
        </section>

        <section class="view active" id="calendarView" aria-labelledby="calendarTitle">
          <div class="section-head">
            <div>
              <p class="muted">月間カレンダー</p>
              <h2 id="calendarTitle"></h2>
            </div>
            <div class="month-controls">
              <button class="icon-button" id="prevMonth" type="button" aria-label="前の月" title="前の月">‹</button>
              <button class="today-button" id="todayButton" type="button">今日</button>
              <button class="icon-button" id="nextMonth" type="button" aria-label="次の月" title="次の月">›</button>
            </div>
          </div>

          <div class="weekday-row" aria-hidden="true">
            <span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span>
          </div>
          <div class="calendar-grid" id="calendarGrid" aria-label="月間カレンダー"></div>
        </section>

        <section class="view" id="timelineView" aria-labelledby="timelineTitle">
          <div class="section-head">
            <div>
              <p class="muted">週間タイムライン</p>
              <h2 id="timelineTitle">今週の重なり</h2>
            </div>
            <button class="secondary-action compact" id="jumpBestDay" type="button">
              <span aria-hidden="true">◎</span>
              一番集まる日
            </button>
          </div>
          <div class="timeline" id="timeline"></div>
        </section>

        <section class="view" id="noticeView" aria-labelledby="noticeTitle">
          <div class="section-head">
            <div>
              <p class="muted">お知らせ</p>
              <h2 id="noticeTitle">グループ連絡</h2>
            </div>
          </div>
          <div class="notice-list">
            <article>
              <strong>今週の候補</strong>
              <p id="bestDayNotice">参加人数を集計中です。</p>
            </article>
            <article>
              <strong>メモ</strong>
              <p>日付を選ぶと集合場所や一言コメントを残せます。</p>
            </article>
            <article>
              <strong>リマインダー</strong>
              <p>本番版では前日と当日に通知を送れる想定です。</p>
            </article>
          </div>
        </section>

        <section class="view" id="profileView" aria-labelledby="profileTitle">
          <div class="section-head">
            <div>
              <p class="muted">マイページ</p>
              <h2 id="profileTitle">プロフィール</h2>
            </div>
          </div>
          <form class="profile-form" id="profileForm">
            <label>
              ニックネーム
              <input id="nicknameInput" maxlength="20" autocomplete="nickname" />
            </label>
            <label>
              表示カラー
              <input id="colorInput" type="color" />
            </label>
            <button class="primary-action" type="submit">
              <span aria-hidden="true">✓</span>
              保存
            </button>
          </form>
          <div class="member-strip" id="memberStrip"></div>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="主要画面">
        <button class="nav-item active" type="button" data-view="calendarView">
          <span aria-hidden="true">▦</span>
          カレンダー
        </button>
        <button class="nav-item" type="button" data-view="timelineView">
          <span aria-hidden="true">≋</span>
          タイムライン
        </button>
        <button class="nav-item" type="button" data-view="noticeView">
          <span aria-hidden="true">●</span>
          通知
        </button>
        <button class="nav-item" type="button" data-view="profileView">
          <span aria-hidden="true">◉</span>
          マイページ
        </button>
      </nav>
    </div>

    <dialog class="day-dialog" id="dayDialog">
      <form method="dialog">
        <div class="dialog-head">
          <div>
            <p class="muted">日付詳細</p>
            <h2 id="dialogTitle"></h2>
          </div>
          <button class="icon-button" value="close" aria-label="閉じる" title="閉じる">×</button>
        </div>
      </form>

      <div class="day-summary" id="daySummary"></div>

      <form class="attendance-form" id="attendanceForm">
        <fieldset>
          <legend>自分の予定</legend>
          <div class="status-grid">
            <label><input type="radio" name="status" value="◎" />◎ 参加できる</label>
            <label><input type="radio" name="status" value="○" />○ たぶん</label>
            <label><input type="radio" name="status" value="△" />△ 未定</label>
            <label><input type="radio" name="status" value="✕" />✕ 難しい</label>
          </div>
        </fieldset>
        <div class="time-pair">
          <label>
            開始
            <input type="time" id="startTime" step="1800" />
          </label>
          <label>
            終了
            <input type="time" id="endTime" step="1800" />
          </label>
        </div>
        <label>
          コメント
          <textarea id="commentInput" maxlength="100" rows="3" placeholder="例: 19時から荻窪ジムなら行ける"></textarea>
        </label>
        <button class="primary-action full" type="submit">
          <span aria-hidden="true">＋</span>
          参加予定を保存
        </button>
      </form>

      <div class="thread" id="commentThread"></div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script>window.CLIMB_SYNC_CONFIG = {
  url: "https://zfsbaqzuzncajsofwnja.supabase.co",

};

const statusLabels = {

const api = window.CLIMB_SYNC_CONFIG || {};
const today = new Date();
let visibleMonth = new Date(today.getFullYear(), today.getMonth(), 1);

function loadProfile() {
  try {
    const saved = JSON.parse(localStorage.getItem(profileKey));
    if (saved?.id && saved?.name) return saved;
  } catch {}
  const profile = {
    id: crypto.randomUUID(),
    name: "あなた",
    initials: "YOU",
    color: "#176b5d",
  };
  localStorage.setItem(profileKey, JSON.stringify(profile));
  return profile;
}

let profile = loadProfile();
let theme = localStorage.getItem(themeKey) || "light";

const calendarTitle = document.querySelector("#calendarTitle");

const dayDialog = document.querySelector("#dayDialog");
const dialogTitle = document.querySelector("#dialogTitle");
const daySummary = document.querySelector("#daySummary");
const attendanceForm = document.querySelector("#attendanceForm");
const commentThread = document.querySelector("#commentThread");
const timeline = document.querySelector("#timeline");
const toast = document.querySelector("#toast");
const syncStatus = document.querySelector("#syncStatus");

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function dateKey(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function parseDate(key) {
  const [year, month, day] = key.split("-").map(Number);
  return new Date(year, month - 1, day);
}

function formatMonth(date) {
  return new Intl.DateTimeFormat("ja-JP", { year: "numeric", month: "long" }).format(date);
}

function formatDay(date) {
  return new Intl.DateTimeFormat("ja-JP", {
    month: "long",
    day: "numeric",
    weekday: "short",
  }).format(date);
}

function initials(name) {
  return name.trim().slice(0, 2).toUpperCase() || "YOU";
}

function showToast(message) {
  toast.textContent = message;
  toast.classList.add("show");
  window.clearTimeout(showToast.timer);
  showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 2600);
}

function setSyncStatus(text, failed = false) {
  syncStatus.textContent = text;
  syncStatus.style.color = failed ? "var(--nope)" : "";
}

function headers(extra = {}) {
  return {
    apikey: api.anonKey,
    Authorization: `Bearer ${api.anonKey}`,
    "Content-Type": "application/json",
    ...extra,
  };
}

function mapRow(row) {
  return {
    memberId: row.user_id,
    name: row.nickname,
    initials: initials(row.nickname),
    color: row.color_hex,
    status: row.status,
    start: row.start_time?.slice(0, 5) || "",
    end: row.end_time?.slice(0, 5) || "",
    comment: row.comment || "",
  };
}

async function loadAttendances({ quiet = false } = {}) {
  if (!api.url || !api.anonKey) {
    setSyncStatus("設定が必要", true);
    return;
  }
  if (!quiet) setSyncStatus("同期中");
  try {
    const response = await fetch(
      `${api.url}/rest/v1/attendances?select=*&group_code=eq.CLIMB-610&order=date.asc`,
      { headers: headers(), cache: "no-store" },
    );
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const rows = await response.json();
    attendances = rows.reduce((grouped, row) => {
      (grouped[row.date] ||= []).push(mapRow(row));
      return grouped;
    }, {});
    renderAll();
    if (selectedDate && dayDialog.open) renderDayDetails();
    setSyncStatus("同期済み");
  } catch (error) {
    console.error(error);
    setSyncStatus("接続エラー", true);
    if (!quiet) showToast("共有データを読み込めませんでした");
  }
}

async function saveAttendance(item) {
  setSyncStatus("保存中");
  const body = {
    group_code: "CLIMB-610",
    date: selectedDate,
    user_id: profile.id,
    nickname: profile.name,
    color_hex: profile.color,
    status: item.status,
    start_time: item.start || null,
    end_time: item.end || null,
    comment: item.comment,
    updated_at: new Date().toISOString(),
  };
  const response = await fetch(`${api.url}/rest/v1/attendances?on_conflict=group_code,date,user_id`, {
    method: "POST",
    headers: headers({ Prefer: "resolution=merge-duplicates,return=minimal" }),
    body: JSON.stringify(body),
  });
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
}

function relevantAttendances(key) {
  return (attendances[key] || []).filter((item) => item.status !== "✕");
}

function renderAvatar(member, title) {
  return `<span class="avatar" style="background:${member.color}" title="${escapeHtml(title || member.name)}">${escapeHtml(member.initials)}</span>`;
}

function renderCalendar() {
  calendarTitle.textContent = formatMonth(visibleMonth);
  calendarGrid.innerHTML = "";
  const year = visibleMonth.getFullYear();
  const month = visibleMonth.getMonth();
  const first = new Date(year, month, 1);
  const mondayOffset = (first.getDay() + 6) % 7;
  const start = new Date(year, month, 1 - mondayOffset);
  const todayKey = dateKey(new Date());

  for (let index = 0; index < 42; index += 1) {
    const date = new Date(start);
    date.setDate(start.getDate() + index);
    const key = dateKey(date);
    const items = relevantAttendances(key);
    const button = document.createElement("button");
    button.type = "button";
    button.className = "day-cell";
    if (date.getMonth() !== month) button.classList.add("is-muted");
    if (key === todayKey) button.classList.add("is-today");
    if (items.length >= 4) button.classList.add("is-popular");
    button.setAttribute("aria-label", `${formatDay(date)}、参加予定${items.length}人`);
    const avatarHtml = items.slice(0, 4).map((item) => renderAvatar(item)).join("");
    const note = escapeHtml(items.find((item) => item.comment)?.comment || "");
    button.innerHTML = `
      <span class="day-number">
        <span>${date.getDate()}</span>
        ${items.length ? `<span class="count-badge">${items.length}人</span>` : ""}
      </span>
      <span class="avatars">${avatarHtml}</span>
      <span class="day-note">${note}</span>
    `;
    button.addEventListener("click", () => openDay(key));
    calendarGrid.appendChild(button);
  }
  updateBestDayNotice();
}

function openDay(key) {
  selectedDate = key;
  dialogTitle.textContent = formatDay(parseDate(key));
  renderDayDetails();
  dayDialog.showModal();
}

function renderDayDetails() {
  const items = attendances[selectedDate] || [];
  const visible = items.filter((item) => item.status !== "✕");
  daySummary.innerHTML = visible.length
    ? visible.map((item) => `
      <div class="participant">
        ${renderAvatar(item)}
        <div>
          <strong>${escapeHtml(item.name)} <span>${item.status}</span></strong>
          <span>${statusLabels[item.status]}</span>
        </div>
        <span>${item.start || "--:--"}〜${item.end || "--:--"}</span>
      </div>
    `).join("")
    : `<p class="muted">まだ参加予定はありません。最初に予定を入れてみましょう。</p>`;

  const mine = items.find((item) => item.memberId === profile.id);
  attendanceForm.reset();
  const status = mine?.status || "◎";
  const radio = attendanceForm.querySelector(`[name="status"][value="${status}"]`);
  if (radio) radio.checked = true;
  document.querySelector("#startTime").value = mine?.start || "19:00";
  document.querySelector("#endTime").value = mine?.end || "21:30";
  document.querySelector("#commentInput").value = mine?.comment || "";

  const comments = visible.filter((item) => item.comment);
  commentThread.innerHTML = comments.length
    ? `<strong>みんなのコメント</strong>${comments.map((item) =>
        `<div class="comment"><strong>${escapeHtml(item.name)}</strong><p>${escapeHtml(item.comment)}</p></div>`
      ).join("")}`
    : "";
}

function renderTimeline() {
  const base = new Date(visibleMonth.getFullYear(), visibleMonth.getMonth(), 11);
  const offset = (base.getDay() + 6) % 7;
  const monday = new Date(base);
  monday.setDate(base.getDate() - offset);
  const dates = Array.from({ length: 7 }, (_, index) => {
    const date = new Date(monday);
    date.setDate(monday.getDate() + index);
    return date;
  });
  const timeSlots = [11, 13, 15, 17, 19, 21];
  const header = `<div class="timeline-row"><div class="time-label">時間</div>${dates.map((date) =>
    `<div class="timeline-cell"><strong>${date.getMonth() + 1}/${date.getDate()}</strong><br><span class="muted">${["日", "月", "火", "水", "木", "金", "土"][date.getDay()]}</span></div>`
  ).join("")}</div>`;
  const rows = timeSlots.map((hour) => {
    const cells = dates.map((date) => {
      const items = relevantAttendances(dateKey(date)).filter((item) => {
        const start = Number((item.start || "99:00").split(":")[0]);
        const end = Number((item.end || "00:00").split(":")[0]);
        return start <= hour && end > hour;
      });
      return `<div class="timeline-cell">${items.map((item) =>
        `<span class="timeline-pill" style="background:${item.color}">${escapeHtml(item.name)}</span>`
      ).join("")}</div>`;
    }).join("");
    return `<div class="timeline-row"><div class="time-label">${hour}:00</div>${cells}</div>`;
  }).join("");
  timeline.innerHTML = `<div class="timeline-table">${header}${rows}</div>`;
}

function getBestDay() {
  return Object.entries(attendances)
    .filter(([key]) => parseDate(key).getMonth() === visibleMonth.getMonth())
    .map(([key]) => ({ key, count: relevantAttendances(key).length }))
    .sort((a, b) => b.count - a.count || a.key.localeCompare(b.key))[0];
}

function updateBestDayNotice() {
  const best = getBestDay();
  document.querySelector("#bestDayNotice").textContent = best
    ? `${formatDay(parseDate(best.key))}が最多で、${best.count}人参加予定です。`
    : "今月はまだ参加予定がありません。";
}

function renderMembers() {
  const unique = new Map([[profile.id, profile]]);
  Object.values(attendances).flat().forEach((item) => unique.set(item.memberId, item));
  document.querySelector("#memberStrip").innerHTML = [...unique.values()]
    .map((member) => `<span class="member-chip">${renderAvatar(member)}${escapeHtml(member.name)}</span>`)
    .join("");
  document.querySelector("#nicknameInput").value = profile.name;
  document.querySelector("#colorInput").value = profile.color;
}

function applyTheme() {
  document.documentElement.classList.toggle("dark", theme === "dark");
}

function renderAll() {
  renderMembers();
  renderCalendar();
  renderTimeline();
}

attendanceForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  const data = new FormData(attendanceForm);
  const item = {
    status: data.get("status"),
    start: document.querySelector("#startTime").value,
    end: document.querySelector("#endTime").value,
    comment: document.querySelector("#commentInput").value.trim(),
  };
  if (!item.status) return showToast("参加ステータスを選んでください");
  try {
    await saveAttendance(item);
    await loadAttendances({ quiet: true });
    showToast("みんなのカレンダーに保存しました");
  } catch (error) {
    console.error(error);
    setSyncStatus("保存エラー", true);
    showToast("保存できませんでした。通信を確認してください");
  }
});

document.querySelector("#prevMonth").addEventListener("click", () => {
  visibleMonth = new Date(visibleMonth.getFullYear(), visibleMonth.getMonth() - 1, 1);
  renderCalendar();
  renderTimeline();
});

document.querySelector("#nextMonth").addEventListener("click", () => {
  visibleMonth = new Date(visibleMonth.getFullYear(), visibleMonth.getMonth() + 1, 1);
  renderCalendar();
  renderTimeline();
});

document.querySelector("#todayButton").addEventListener("click", () => {
  const now = new Date();
  visibleMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  renderCalendar();
  renderTimeline();
});

document.querySelector("#copyInvite").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(location.origin + location.pathname);
    showToast("招待リンクをコピーしました");
  } catch {
    showToast("ブラウザのURLを友達に送ってください");
  }
});

document.querySelector("#themeToggle").addEventListener("click", () => {
  theme = theme === "dark" ? "light" : "dark";
  localStorage.setItem(themeKey, theme);
  applyTheme();
});

document.querySelector("#profileForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const name = document.querySelector("#nicknameInput").value.trim();
  if (!name) return;
  profile = {
    ...profile,
    name,
    initials: initials(name),
    color: document.querySelector("#colorInput").value,
  };
  localStorage.setItem(profileKey, JSON.stringify(profile));
  renderMembers();
  showToast("プロフィールを保存しました");
});

document.querySelector("#jumpBestDay").addEventListener("click", () => {
  const best = getBestDay();
  if (best) openDay(best.key);
});

document.querySelectorAll(".nav-item").forEach((button) => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".nav-item").forEach((item) => item.classList.remove("active"));
    document.querySelectorAll(".view").forEach((view) => view.classList.remove("active"));
    button.classList.add("active");
    document.querySelector(`#${button.dataset.view}`).classList.add("active");
  });
});

applyTheme();
renderAll();
loadAttendances();
window.setInterval(() => loadAttendances({ quiet: true }), 30000);
</script>
  </body>
</html>
